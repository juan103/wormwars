# The CPU test suite, on every push and pull request, so anyone can see it pass.
# The connectome is downloaded from its source and hash-checked at run time by
# scripts/fetch_connectome.py; it is never committed or cached here (AGENTS.md rule 1).
# GPU tests (marker `gpu`) need CUDA and are not run.
# The `slow` tests run in jobs of their own, in parallel with the rest: in one job the suite had grown past the
# 90-minute timeout (D343). The slow job alone then passed 120 minutes, so 03h's slow tests have a job of their own,
# and the output is unbuffered and verbose so that a timeout shows where it stopped (D344). That job then took 117 of
# its 120 minutes on roadmap and was cancelled at 120 on main, so 03h's pilot-driver tests have a job of their own
# (D348); the two 03h parts hold the same 36 tests (17 + 19).
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        part:
          - {name: fast, markers: "not gpu and not slow", paths: "tests"}
          - {name: slow, markers: "slow and not gpu", paths: "tests --ignore-glob=tests/test_e03h_*"}
          - {name: slow-03h-pilot, markers: "slow and not gpu", paths: "tests/test_e03h_pilot_driver.py"}
          - {name: slow-03h-rest, markers: "slow and not gpu", paths: "tests --ignore=tests/test_e03h_pilot_driver.py -k test_e03h"}
    name: cpu (${{ matrix.part.name }})
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # some tests read git history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the pinned versions (torch's CPU build)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.12.0 --index-url https://download.pytorch.org/whl/cpu
          grep -v '^torch==' requirements.txt > "$RUNNER_TEMP/requirements-cpu.txt"
          python -m pip install -r "$RUNNER_TEMP/requirements-cpu.txt"
      - name: Fetch and hash-check the connectome
        run: python scripts/fetch_connectome.py
      - name: CPU tests
        env:
          PYTHONUNBUFFERED: "1"
        run: python -m pytest ${{ matrix.part.paths }} -m "${{ matrix.part.markers }}" -p no:cacheprovider -v --durations=25
