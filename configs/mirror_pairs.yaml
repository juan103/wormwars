# Left-right homolog pairs of the hermaphrodite connectome (Cook et al. 2019 names).
# Curated for experiment 03 (D050): built from the dataset's names, then checked by hand
# against WormAtlas nomenclature, where a trailing L/R marks a bilateral homolog. Checked:
# every pair has the same neuron type in the dataset. Single neurons whose names end in L or
# R without a partner (AVL, AQR, PQR, PVR, RIR) are single cells, listed as unpaired. Unpaired
# neurons map to themselves (midline and single cells, including the ventral cord motor
# neurons, and dorsal/ventral singles such as RMED/RMEV). Names only; no connectivity.
