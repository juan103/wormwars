# Default configuration.
#
# Every field of every section in wormwars/config.py appears here with its default. This file is
# the documentation of what is tunable; the dataclasses in wormwars/config.py are the source of
# truth for types and defaults. Load with Config.from_yaml(path). An unknown section or field is
# an error, not a silently ignored typo.
#
# Lengths are in grid cells, angles in radians, time in world ticks. Ranges written as [lo, hi]
# are sampled per world.

# The leaky rate model and the bounds evolution must respect.
brain:
  substeps: 8
  tau_min: 0.5
  tau_max: 20.0
  w_max: 3.0
  g_max: 2.0
  b_max: 2.0
  init_w_scale: 0.2
  init_g_scale: 0.05
  init_bias_std: 0.5
  init_tau_log_uniform: true
  init_chem_magnitude: anatomical
  init_gap_magnitude: anatomical
  init_permutation_seed: 0
  dale: false
  input_gain: 1.0
  input_max: 5.0
  # Chemical synapses carry signal from the presynaptic to the postsynaptic neuron. Experiment 01
  # ran reversed ("post_to_pre") by mistake; see DECISIONS.md D031. Only a run bundle recorded
  # before the fix is read as reversed (Config.from_bundle); ordinary configs default to pre_to_post.
  chem_direction: pre_to_post

# The arena, the bodies and the energy economy.
world:
  n_swarms: 1
  weys_per_swarm: 20
  max_ticks: 600
  cells_per_wey: 24.0
  min_side: 24
  body_length: 2.4
  max_speed: 0.35
  reverse_fraction: 0.4
  max_turn: 0.3
  forward_gain: 4.0
  turn_gain: 2.0
  start_energy: 12.0
  max_energy: 40.0
  body_mass: 6.0
  metabolic_drain: 0.035
  move_cost: 0.02
  hazard_damage: 0.25
  eat_rate: 0.6
  pheromone_deposit: 1.0
  pheromone_decay: 0.93
  pheromone_diffusion: 0.35
  sense_scale_food: 0.35
  sense_scale_pheromone: 0.35
  sense_scale_hazard: 2.0
  sense_scale_damage: 2.0
  sense_scale_collision: 2.0
  body_splat: 1.0
  crowd_threshold: 0.8
  crowd_resist: 0.6
  crowd_push: 0.1
  crowd_blur: 1
  # experiment 02 options (defaults reproduce every earlier experiment)
  food_sensing: stereo
  food_probe: real
  food_odour_sigma: 0.0
  food_probe_radius: 0.0
  food_probe_hold: 1

# Per-world randomisation. Every field is a range, sampled independently per world.
map:
  food_patches: [3, 6]
  food_patch_radius: [2.5, 5.0]
  food_per_patch: [70.0, 160.0]
  food_centre_bias: 0.62
  hazard_patches: [1, 4]
  hazard_radius: [2.0, 4.0]
  hazard_strength: [0.5, 1.0]
  hazard_spawn_clearance: 6.0
  spawn_margin: 3.0
  spawn_spread: 0.28
  food_regen: 0.0

# Stage 1 is automatic biting; stage 2 gates the bite and the bite-sized mouthful on pump.
combat:
  attack_strength: 1.0
  attack_offset: 0.9
  attack_blur: 1
  damage_k: 0.55
  head_armor: 0.25
  transfer_fraction: 0.5
  max_flank_payback: 0.1
  max_head_on_asymmetry: 1.5
  pump_cost: 0.1

# MutationConfig(w_sigma: 'float' = 0.08, g_sigma: 'float' = 0.04, tau_sigma: 'float' = 0.15, bias_sigma: 'float' = 0.05, p_mutate: 'float' = 1.0)
mutation:
  w_sigma: 0.08
  g_sigma: 0.04
  tau_sigma: 0.15
  bias_sigma: 0.05
  p_mutate: 1.0

# One evolutionary run.
evo:
  population: 32
  generations: 40
  elites: 3
  truncation: 8
  worlds_per_strain: 6
  holdout_worlds: 24
  islands: 1
  migrate_every: 10
  migrants: 1
  chunk_worlds: 512
  train_seed_base: 0
  train_seed_span: 1000000
  holdout_seed_base: 900000000
  eval_ticks: 0
  opponents_self: 3
  opponents_hof: 2
  coevo_worlds: 2
  coevo_sizes: [40, 40]
  coevo_lopsided: false
  hof_capacity: 12
  suite_every: 5
  suite_size: 6
  suite_worlds: 8
